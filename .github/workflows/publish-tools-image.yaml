name: Publish svalbard-tools image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - build-tools/**
      - .github/workflows/publish-tools-image.yaml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Also publish under this version tag (for example 0.5.0), to republish a release's image
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/svalbard-tools

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Both architectures are published: a tag that is an image index without
      # linux/arm64 cannot be pulled on Apple Silicon and arm64 Linux hosts.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta-base
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha

      - uses: docker/metadata-action@v6
        id: meta-browser
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-browser,onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: tools-base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: tools-browser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-browser.outputs.tags }}
          labels: ${{ steps.meta-browser.outputs.labels }}
